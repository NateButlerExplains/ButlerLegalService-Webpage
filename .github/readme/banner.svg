<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Butler Legal Service. Legal consulting and advocacy. Missouri and North Carolina.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18382f"/>
      <stop offset="1" stop-color="#0e2119"/>
    </linearGradient>
    <pattern id="lines" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c6a35d"/>
      <stop offset="1" stop-color="#8f7238"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#lines)"/>

  <!-- brand mark: two-column monogram in a gold frame -->
  <g transform="translate(84,72)">
    <rect x="0" y="0" width="176" height="176" rx="6" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <rect x="14" y="14" width="148" height="148" rx="3" fill="none" stroke="#c6a35d" stroke-opacity="0.35" stroke-width="1"/>
    <text x="88" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#fbfaf6" letter-spacing="1">B<tspan fill="#c6a35d">L</tspan>S</text>
    <line x1="40" y1="140" x2="136" y2="140" stroke="url(#gold)" stroke-width="2"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(320,0)">
    <text x="0" y="146" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#fbfaf6" letter-spacing="0.5">Butler Legal Service</text>
    <line x1="2" y1="168" x2="640" y2="168" stroke="url(#gold)" stroke-width="2"/>
    <text x="0" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#c6a35d" letter-spacing="3">LEGAL CONSULTING AND ADVOCACY</text>
    <text x="0" y="244" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#fbfaf6" fill-opacity="0.72" letter-spacing="1">Missouri · North Carolina · butlerlegalservice.com</text>
  </g>

  <!-- corner accent -->
  <g stroke="url(#gold)" stroke-width="2" fill="none" opacity="0.9">
    <path d="M1200 40 h40 v40"/>
    <path d="M1240 280 h-40 M1240 280 v-40"/>
  </g>
</svg>
